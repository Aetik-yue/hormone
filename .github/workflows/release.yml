name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (for example v1.2.3)'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  HORMONE_UPDATE_BASE_URL: ${{ vars.HORMONE_UPDATE_BASE_URL }}

concurrency:
  # Serialize publication so two tags cannot race to overwrite latest.json.
  group: hormone-android-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release version
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'A stable vX.Y.Z release tag is required.' >&2
            exit 1
          fi
          APP_VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml)
          if [ "${APP_VERSION%%+*}" != "${RELEASE_TAG#v}" ]; then
            echo 'Release tag does not match pubspec.yaml.' >&2
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          cache: true

      # This repo is maintained without generated platform directories.
      # Recreate the Android project in CI with the app's application id.
      - name: Create platform projects
        run: |
          flutter create --no-pub --platforms=android --org com.aetikyue .
          # Platform generation may rewrite the lockfile. Use the release's pinned dependencies.
          git restore --source=HEAD -- pubspec.lock

      # Apply custom Gradle config (AGP 8.11 compat, NDK, Kotlin 2.2.20, desugaring)
      - name: Apply custom Gradle config
        run: |
          NDK_VERSION=$(ls $ANDROID_HOME/ndk/ | sort -V | tail -1)
          sed "s/__NDK_VERSION__/$NDK_VERSION/g" native_templates/android/build.gradle > android/build.gradle
          cp native_templates/android/settings.gradle android/settings.gradle
          cp native_templates/android/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          # app 模块启用 desugaring、固定签名、小组件和应用内更新原生配置。
          cp native_templates/android/app/build.gradle.kts android/app/build.gradle.kts
          cp native_templates/android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/java/com/aetikyue/hormone
          mkdir -p android/app/src/main/res/layout android/app/src/main/res/xml
          cp native_templates/android/app/src/main/java/com/aetikyue/hormone/CourseWidgetProvider.kt \
            android/app/src/main/java/com/aetikyue/hormone/CourseWidgetProvider.kt
          cp native_templates/android/app/src/main/res/layout/course_widget.xml \
            android/app/src/main/res/layout/course_widget.xml
          cp native_templates/android/app/src/main/res/xml/course_widget_info.xml \
            android/app/src/main/res/xml/course_widget_info.xml
          mkdir -p android/app/src/main/kotlin/com/aetikyue/hormone
          cp native_templates/android/app/src/main/kotlin/com/aetikyue/hormone/MainActivity.kt \
            android/app/src/main/kotlin/com/aetikyue/hormone/MainActivity.kt
          cp native_templates/android/app/src/main/res/xml/filepaths.xml \
            android/app/src/main/res/xml/filepaths.xml

      - name: Configure stable release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/hormone-release-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "$KEYSTORE_PATH"
          } > android/key.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      - name: Build universal and per-architecture APKs
        run: |
          set -euo pipefail
          mkdir -p build/release
          flutter build apk --release --dart-define="HORMONE_UPDATE_BASE_URL=$HORMONE_UPDATE_BASE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk "build/release/hormone-${RELEASE_TAG}-android.apk"
          # Build each target without --split-per-abi: Flutter otherwise adds ABI-specific
          # versionCode offsets, preventing a later upgrade back to a universal APK.
          for pair in android-arm64:arm64-v8a android-arm:armeabi-v7a android-x64:x86_64; do
            flutter build apk --release --target-platform="${pair%%:*}" \
              --dart-define="HORMONE_UPDATE_BASE_URL=$HORMONE_UPDATE_BASE_URL"
            cp build/app/outputs/flutter-apk/app-release.apk "build/release/hormone-${RELEASE_TAG}-${pair#*:}.apk"
          done

      - name: Verify APK signing and version continuity
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APP_VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml)
          for APK in build/release/*.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/hormone-apk-signature.txt"
            grep -Fq 'Number of signers: 1' "$RUNNER_TEMP/hormone-apk-signature.txt"
            grep -Fq 'certificate SHA-256 digest: 7206848b62105dcc9ea3e62a7a2f11158f14b6705849e10441dcf68fae52a6f6' \
              "$RUNNER_TEMP/hormone-apk-signature.txt"
            "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/hormone-apk-badging.txt"
            grep -Fq "versionCode='${APP_VERSION##*+}'" "$RUNNER_TEMP/hormone-apk-badging.txt"
          done

      - name: Build App Bundle
        run: |
          flutter build appbundle --release --dart-define="HORMONE_UPDATE_BASE_URL=$HORMONE_UPDATE_BASE_URL"
          cp build/app/outputs/bundle/release/app-release.aab "build/release/hormone-${RELEASE_TAG}-android.aab"

      - name: Prepare checksums and update manifest
        run: |
          python3 scripts/verify_apk_architectures.py --tag "$RELEASE_TAG"
          python3 scripts/prepare_update_manifest.py --tag "$RELEASE_TAG"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ env.RELEASE_TAG }}
          path: build/release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          NOTES="version/${VERSION}/更新日志.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/release/* --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" build/release/* \
              --title "Hormone $TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" build/release/* \
              --title "Hormone $TAG" --generate-notes
          fi

      # Optional: enable only after configuring your own HTTPS download source.
      - name: Publish update mirror
        if: env.HORMONE_UPDATE_BASE_URL != ''
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_S3_URI: ${{ vars.HORMONE_UPDATE_S3_URI }}
          UPDATE_S3_ENDPOINT: ${{ vars.HORMONE_UPDATE_S3_ENDPOINT }}
          AWS_DEFAULT_REGION: ${{ vars.HORMONE_UPDATE_S3_REGION || 'us-east-1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.HORMONE_UPDATE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HORMONE_UPDATE_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${UPDATE_S3_URI:?Configure HORMONE_UPDATE_S3_URI before enabling the mirror}"
          : "${AWS_ACCESS_KEY_ID:?Missing mirror access key}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing mirror secret key}"
          ENDPOINT_ARGS=()
          if [ -n "$UPDATE_S3_ENDPOINT" ]; then
            ENDPOINT_ARGS=(--endpoint-url "$UPDATE_S3_ENDPOINT")
          fi
          # Upload all immutable version files first; only then advertise the version.
          aws "${ENDPOINT_ARGS[@]}" s3 cp build/release/ "${UPDATE_S3_URI%/}/${RELEASE_TAG}/" \
            --recursive --exclude '*.aab' --exclude latest.json --cache-control 'public,max-age=31536000,immutable'
          # Rebuilding an older tag must not replace the current update pointer.
          LATEST_TAG=$(gh api repos/Aetik-yue/hormone/releases/latest --jq .tag_name)
          if [ "$LATEST_TAG" = "$RELEASE_TAG" ]; then
            aws "${ENDPOINT_ARGS[@]}" s3 cp build/release/latest.json "${UPDATE_S3_URI%/}/latest.json" \
              --content-type 'application/json; charset=utf-8' --cache-control 'no-cache,max-age=0'
          fi
