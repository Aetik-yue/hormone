// 为 jni 等需要 NDK 的插件提供 ndkVersion 属性（在子项目评估前注入）
// CI 中 __NDK_VERSION__ 会被替换为实际安装的 NDK 版本
rootProject.ext.ndkVersion = "__NDK_VERSION__"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
// 为旧版 Flutter 插件注入 flutter 扩展属性（AGP 8.9+ 不再自动注入），
// 解决 package_info_plus 等插件引用 flutter.compileSdkVersion 报错的问题。
// 注意：:app 由 Flutter Gradle Plugin 自行创建 flutter 扩展，不能覆盖。
subprojects {
    if (project.name != "app" && !project.hasProperty("flutter")) {
        project.ext["flutter"] = [
            compileSdkVersion: 36,
            minSdkVersion    : 21,
            targetSdkVersion : 36,
            ndkVersion       : "__NDK_VERSION__",
        ]
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// 兼容新版 AGP（8.5+）：为所有 Android 子项目（含 Flutter 插件）显式兜底 compileSdk。
subprojects {
    def fixCompileSdk = { proj ->
        def android = proj.extensions.findByName("android")
        if (android != null && android.compileSdk == null) {
            android.compileSdk = 36
        }
        if (android != null && android.ndkVersion == null) {
            android.ndkVersion = "__NDK_VERSION__"
        }
    }
    if (project.state.executed) {
        fixCompileSdk(project)
    } else {
        afterEvaluate { fixCompileSdk(it) }
    }
}

// 强制所有子项目的 Kotlin 编译任务使用 languageVersion 1.8，
// 解决 sentry_flutter 等旧插件声明 languageVersion 1.6 在 Kotlin 2.2 下报错的问题。
subprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            languageVersion = "1.8"
            apiVersion = "1.8"
        }
    }
}
