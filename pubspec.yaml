name: hormone
description: A pure, minimal college course schedule app for iOS and Android.
publish_to: 'none'
version: 1.1.1+14

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  file_picker: ^8.0.0
  uuid: ^4.4.0
  home_widget: ^0.6.0
  flutter_animate: ^4.5.0
  sentry_flutter: ^8.0.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.0
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/

# App icon generator (run after `flutter pub get`):
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
  linux:
    generate: false

# Splash screen generator (run after `flutter pub get`):
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#5B8DEF"
  image: "assets/splash/logo.png"
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  android_12:
    image: "assets/splash/logo.png"
    color: "#5B8DEF"
